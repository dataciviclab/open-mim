root: "../../out"
schema_version: 1

dataset:
  name: "mim_anagrafica_scuole_statali"
  source_id: "mim_opendata"
  tags: [istruzione, mim, anagrafica, scuole, statali]
  category: istruzione
  years: [2024]

raw:
  sources:
    - name: "mim_anagrafica_scuole_csv"
      type: "http_file"
      args:
        url: "https://dati.istruzione.it/opendata/opendata/catalogo/elements1/SCUANAGRAFESTAT20242520250831.csv"
        filename: "SCUANAGRAFESTAT20242520250831.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    header: true
    encoding: "utf-8"
    strict_mode: false
    ignore_errors: true
    trim_whitespace: true
  required_columns: [anno_scolastico, codice_scuola, denominazione_scuola, area_geografica, regione, provincia, comune, codice_comune_scuola, grado_istruzione_scuola]
  validate:
    not_null: [codice_scuola, anno_scolastico]
    primary_key: [codice_scuola]
    min_rows: 1000

mart:
  tables:
    - name: "mart_scuole_statali_geo"
      sql: "sql/mart.sql"
  required_tables:
    - "mart_scuole_statali_geo"
  validate:
    table_rules:
      mart_scuole_statali_geo:
        required_columns: [anno_scolastico, codice_scuola, regione, provincia, comune, codice_comune_scuola]
        primary_key: [codice_scuola]
        min_rows: 1000

validation:
  fail_on_error: true

output:
  artifacts: "standard"
