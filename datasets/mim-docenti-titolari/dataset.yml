root: "../../out"
schema_version: 1

dataset:
  name: "mim_docenti_titolari"
  source_id: "mim_opendata"
  tags: [istruzione, mim, docenti, personale-scuola, genere, territorio]
  category: istruzione
  years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
  time_coverage: {start_year: 2016, end_year: 2024}

raw:
  output_policy: overwrite
  sources:
    - name: "mim_doctit_csv"
      type: "http_file"
      client:
        timeout: 60
        retries: 2
      args:
        url: "https://dati.istruzione.it/opendata/opendata/catalogo/elements1/DOCTIT"
        filename: "DOCTIT_{year}.csv"
        url_suffix_by_year:
          2016: "20161720170831.csv"
          2017: "20171820180831.csv"
          2018: "20181920190831.csv"
          2019: "20192020200831.csv"
          2020: "20202120200901.csv"
          2021: "20212220220831.csv"
          2022: "20222320230831.csv"
          2023: "20232420240831.csv"
          2024: "20242520250831.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: "utf-8"
    header: true
  required_columns:
    - anno
    - anno_scolastico
    - provincia
    - ordine_scuola
    - tipo_posto
    - fascia_eta
    - docenti_maschile
    - docenti_femminile
    - docenti_totale
  validate:
    not_null: [anno, provincia, ordine_scuola, fascia_eta]
    min_rows: 1000
    primary_key: [anno, provincia, ordine_scuola, tipo_posto, fascia_eta]

mart:
  tables:
    # Confronto territoriale per provincia × ordine (anno corrente)
    - name: "mart_sintesi_provincia"
      sql: "sql/mart_sintesi_provincia.sql"
    # Serie storica multi-anno per ordine scolastico
    - name: "mart_trend_ordine"
      sql: "sql/mart_trend_ordine.sql"
      years: [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
    # Invecchiamento del corpo docente per ordine × fascia d'età
    - name: "mart_fasce_eta"
      sql: "sql/mart_fasce_eta.sql"
  required_tables:
    - "mart_sintesi_provincia"
    - "mart_trend_ordine"
    - "mart_fasce_eta"
  validate:
    table_rules:
      mart_sintesi_provincia:
        required_columns: [anno, provincia, ordine_scuola, docenti_totale, quota_femminile_pct, quota_nazionale_pct]
        primary_key: [anno, provincia, ordine_scuola]
        min_rows: 100
      mart_trend_ordine:
        required_columns: [anno, ordine_scuola, docenti_totale, delta_docenti, variazione_pct]
        primary_key: [anno, ordine_scuola]
        min_rows: 9
      mart_fasce_eta:
        required_columns: [anno, ordine_scuola, fascia_eta, docenti_totale, quota_pct]
        primary_key: [anno, ordine_scuola, fascia_eta]
        min_rows: 10

validation:
  fail_on_error: true

output:
  artifacts: "standard"
